{% extends "base.html" %}
{% block title %}Reset Password - UniShare Nkumba{% endblock %}

{% block content %}
<section class="container" style="max-width: 640px; padding-top: 3rem; padding-bottom: 3rem;">
    <div class="card">
        <div class="card-header">
            <h1><i class="fas fa-lock"></i> Set a new password</h1>
            <p>Choose a password of at least eight characters.</p>
        </div>
        <form method="POST">
            <div class="form-group">
                <label for="password">New password</label>
                <input class="form-input" id="password" name="password" type="password" required minlength="8" autocomplete="new-password">
            </div>
            <div class="form-group">
                <label for="confirm_password">Confirm new password</label>
                <input class="form-input" id="confirm_password" name="confirm_password" type="password" required minlength="8" autocomplete="new-password">
            </div>
            <button class="btn btn-primary" type="submit"><i class="fas fa-check"></i> Reset password</button>
        </form>
    </div>
</section>
{% endblock %}
