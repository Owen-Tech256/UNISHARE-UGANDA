{% extends "base.html" %}
{% block title %}400 - Bad Request{% endblock %}

{% block content %}
<div class="error-page-container">
    <div class="error-content">
        <div class="error-icon">
            <i class="fas fa-exclamation-circle"></i>
        </div>
        <h1 class="error-code">400</h1>
        <h2 class="error-title">Bad Request</h2>
        <p class="error-message">
            Sorry, we couldn't process your request. Please check your input and try again.
        </p>
        <div class="error-actions">
            <a href="{{ url_for('auth.index') }}" class="btn btn-primary">
                <i class="fas fa-home"></i> Go Home
            </a>
        </div>
    </div>
</div>
{% endblock %}
