{% extends "base.html" %}
{% block title %}{{ page.title }} - UniShare Nkumba{% endblock %}

{% block content %}
<section class="container" style="max-width: 900px; padding-top: 2rem; padding-bottom: 3rem;">
    <div class="card">
        <p style="color: var(--secondary); font-weight: 700; text-transform: uppercase; letter-spacing: .08em;">{{ page.eyebrow }}</p>
        <h1>{{ page.title }}</h1>
        <p style="font-size: 1.05rem; color: var(--text-muted); margin: .75rem 0 2rem;">{{ page.intro }}</p>
        {% for heading, body in page.sections %}
            <section style="margin-bottom: 1.5rem;">
                <h2 style="font-size: 1.1rem; margin-bottom: .35rem;">{{ heading }}</h2>
                <p>{{ body }}</p>
            </section>
        {% endfor %}
    </div>
</section>
{% endblock %}
