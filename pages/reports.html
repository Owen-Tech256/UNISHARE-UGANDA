<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reported Resources - UniShare Uganda</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/style.css">
</head>
<body data-page="admin">
<a href="#main" class="skip-link">Skip to content</a>
<div id="site-header"></div>

<main id="main" class="page-main">
  <div class="container">
    <div class="page-header">
      <h1>Reported Resources</h1>
      <p>Review reports, resolve them, or remove problematic resources from public view.</p>
    </div>

    <div class="admin-toolbar">
      <div class="admin-filters">
        <select id="reportStatusFilter" class="input" style="max-width:180px;">
          <option value="open">Open reports</option>
          <option value="resolved">Resolved</option>
          <option value="">All</option>
        </select>
      </div>
    </div>

    <div class="table-wrap">
      <table class="data-table">
        <thead>
          <tr>
            <th>Resource</th><th>Reason</th><th>Reporter</th><th>Date</th><th>Status</th><th>Actions</th>
          </tr>
        </thead>
        <tbody id="reportsTableBody"></tbody>
      </table>
    </div>

    <div class="empty-state" id="reportsEmpty" style="display:none;">
      <h3>No reports here</h3>
      <p>Nothing reported under this filter.</p>
    </div>
  </div>
</main>

<div id="site-footer"></div>

<script src="/static/js/main.js"></script>
<script src="/static/js/admin.js"></script>
</body>
</html>
